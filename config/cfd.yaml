models_from: _models.yaml

modules:
  # workbench.library from the model's modules ADF (3.2.3 only):
  # 3.1 has them in F8 source ROM). ADF-sourced rows must use rom: "E0".
  - {adf: "/opt/AmigaOS/Update3.2.3/ADFs/ModulesA600_3.2.3.adf",  adf_path: "LIBS/workbench.library", os: "3.2.3", cpu: "68000", rom: "E0"}
  - {adf: "/opt/AmigaOS/Update3.2.3/ADFs/ModulesA1200_3.2.3.adf", adf_path: "LIBS/workbench.library", os: "3.2.3", cpu: "68020", rom: "E0"}

  # rexxsyslib from a specific Workbench ADF, per OS.
  - {adf: "/opt/AmigaOS/AmigaOS3.2/adf/workbench3.2.adf",        adf_path: "Libs/rexxsyslib.library", os: "3.2.3",               rom: "E0"}
  - {adf: "/opt/AmigaOS/AmigaOS3.1/ADFs/wbench31.adf",           adf_path: "Libs/rexxsyslib.library", os: "3.1",                 rom: "E0"}

  # icon.library from IconLIB:
  - {skip: "icon.library"} # omit the stock icon.library (<=3.1)
  - {file: "/opt/AmigaOS/IconLib/46.4.602/Libs/icon.library",       cpu: "68020", rom: "E0"}
  - {file: "/opt/AmigaOS/IconLib/46.4.602/Libs/68000/icon.library", cpu: "68000", rom: "E0"}

  # Filesystems:
  - {file: "/opt/AmigaOS/pfs/v20,0/pfs3aio",                                      rom: "E0"}
  - {file: "/opt/AmigaOS/sfs/v1.280/SmartFilesystem",  cpu: "68020", os: "3.2.3", rom: "E0"}
  - {file: "/opt/AmigaOS/sfs/v1.280/SmartFilesystem",  cpu: "68020", os: "3.1",   rom: "E0"}

  # Fat95:
  - {file: "/opt/AmigaOS/fat95/3.24/68000/fat95",      cpu: "68000",              rom: "E0"}
  - {file: "/opt/AmigaOS/fat95/3.24/68020/fat95",      cpu: "68020",              rom: "E0"}

  # CompactFlash:
  # - 3.1 / 2.05 / 3.2.3 only (2.04 omits both modules entirely as A500plus has no PCMCIA slot and no internal IDE.)
  # - there is a room in F8 for ptable.library)
  - {file: "/opt/AmigaOS/cfd/1.44/full/68000/libs/ptable.library",      cpu: "68000", os: "3.2.3", rom: "F8"}
  - {file: "/opt/AmigaOS/cfd/1.44/full/68020/libs/ptable.library",      cpu: "68020", os: "3.2.3", rom: "F8"}
  - {file: "/opt/AmigaOS/cfd/1.44/full/68000/libs/ptable.library",      cpu: "68000", os: "3.1",   rom: "F8"}
  - {file: "/opt/AmigaOS/cfd/1.44/full/68020/libs/ptable.library",      cpu: "68020", os: "3.1",   rom: "F8"}
  - {file: "/opt/AmigaOS/cfd/1.44/full/68000/libs/ptable.library",      cpu: "68000", os: "2.05",  rom: "F8"}

  - {file: "/opt/AmigaOS/cfd/1.44/full/68020/devs/compactflash.device", cpu: "68020", os: "3.2.3", rom: "E0"}
  - {file: "/opt/AmigaOS/cfd/1.44/full/68000/devs/compactflash.device", cpu: "68000", os: "3.2.3", rom: "E0"}
  - {file: "/opt/AmigaOS/cfd/1.44/full/68000/devs/compactflash.device", cpu: "68000", os: "3.1",   rom: "E0"}
  - {file: "/opt/AmigaOS/cfd/1.44/full/68020/devs/compactflash.device", cpu: "68020", os: "3.1",   rom: "E0"}
  - {file: "/opt/AmigaOS/cfd/1.44/full/68000/devs/compactflash.device", cpu: "68000", os: "2.05",  rom: "E0"}
