models_from: _models.yaml

modules:
  # workbench.library + icon.library from the model's modules ADF (3.2.3 only;
  # 3.1 has them in F8 source ROM). ADF-sourced rows must use rom: "E0".
  - {adf: "/opt/AmigaOS/Update3.2.3/ADFs/ModulesA600_3.2.3.adf",  adf_path: "LIBS/workbench.library", os: "3.2.3", cpu: "68000", rom: "E0"}
  - {adf: "/opt/AmigaOS/Update3.2.3/ADFs/ModulesA1200_3.2.3.adf", adf_path: "LIBS/workbench.library", os: "3.2.3", cpu: "68020", rom: "E0"}
  - {adf: "/opt/AmigaOS/Update3.2.3/ADFs/ModulesA600_3.2.3.adf",  adf_path: "LIBS/icon.library",      os: "3.2.3", cpu: "68000", rom: "E0"}
  - {adf: "/opt/AmigaOS/Update3.2.3/ADFs/ModulesA1200_3.2.3.adf", adf_path: "LIBS/icon.library",      os: "3.2.3", cpu: "68020", rom: "E0"}

  # rexxsyslib from a specific Workbench ADF, per OS.
  - {adf: "/opt/AmigaOS/AmigaOS3.2/adf/workbench3.2.adf", adf_path: "Libs/rexxsyslib.library", os: "3.2.3", rom: "E0"}
  - {adf: "/opt/AmigaOS/AmigaOS3.1/ADFs/wbench31.adf", adf_path: "Libs/rexxsyslib.library", os: "3.1", rom: "E0"}

  # Filesystems (all builds):
  - {file: "/opt/AmigaOS/pfs/v20,0/pfs3aio", rom: "E0"}
  - {file: "/opt/AmigaOS/fat95/3.23/68000/fat95", cpu: "68000", rom: "E0"}
  - {file: "/opt/AmigaOS/fat95/3.23/68020/fat95", cpu: "68020", rom: "E0"}

  # Compiled artifacts.
  # - 3.2.3 has room in F8 for ptable.library
  # - 3.1 / 2.05's F8 is space-full so ptable goes to E0.
  # - 2.04 omits both modules entirely as A500plus has no PCMCIA slot and no internal IDE.
  - {file: "/opt/AmigaOS/cfd/1.43/full/68000/libs/ptable.library",      cpu: "68000", os: "3.2.3", rom: "F8"}
  - {file: "/opt/AmigaOS/cfd/1.43/full/68020/libs/ptable.library",      cpu: "68020", os: "3.2.3", rom: "F8"}
  - {file: "/opt/AmigaOS/cfd/1.43/full/68000/libs/ptable.library",      cpu: "68000", os: "3.1",   rom: "E0"}
  - {file: "/opt/AmigaOS/cfd/1.43/full/68020/libs/ptable.library",      cpu: "68020", os: "3.1",   rom: "E0"}
  - {file: "/opt/AmigaOS/cfd/1.43/full/68000/libs/ptable.library",      cpu: "68000", os: "2.05",  rom: "E0"}

  - {file: "/opt/AmigaOS/cfd/1.43/full/68020/devs/compactflash.device", cpu: "68020", os: "3.2.3", rom: "E0"}
  - {file: "/opt/AmigaOS/cfd/1.43/full/68000/devs/compactflash.device", cpu: "68000", os: "3.2.3", rom: "E0"}
  - {file: "/opt/AmigaOS/cfd/1.43/full/68000/devs/compactflash.device", cpu: "68000", os: "3.1",   rom: "E0"}
  - {file: "/opt/AmigaOS/cfd/1.43/full/68000/devs/compactflash.device", cpu: "68020", os: "3.1",   rom: "E0"}
  - {file: "/opt/AmigaOS/cfd/1.43/full/68000/devs/compactflash.device", cpu: "68000", os: "2.05",  rom: "E0"}
